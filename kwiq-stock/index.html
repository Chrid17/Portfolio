  });
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'loginForm') doLogin(f);
    if (f.id === 'signupForm') doSignup(f);
    if (!me) return;
    if (f.id === 'recForm') submitRecord();
    if (f.id === 'productForm') saveProduct(f);
    if (f.id === 'profileForm') saveProfile(f);
    if (f.id === 'businessForm') saveBusiness(f);
    if (f.id === 'passwordForm') savePassword(f);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'scanManual') { e.preventDefault(); const c = e.target.value.trim(); if (c) { handleCode(c, true); e.target.value = ''; } return; }
    if (e.key !== 'Escape') return;
    if ($('#scanner').innerHTML) closeScanner(); else if ($('#modal').innerHTML) closeModal();
  });
  window.addEventListener('hashchange', () => { if ($('#scanner').innerHTML) closeScanner(); });

  // ---------------------------------------------------------------- camera scanner
  // Uses the browser's BarcodeDetector where available (Chrome, Edge, Android) and
  // falls back to the ZXing library (Safari/iPhone, Firefox). Needs HTTPS for camera access.
  const byBarcode = (code) => db.products.find((p) => p.barcode && p.barcode === String(code).trim());
  const scan = { opts: null, stream: null, timer: null, reader: null, last: '', lastAt: 0, busy: false };
  const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'code_93', 'itf', 'codabar', 'qr_code', 'data_matrix'];

  function openScanner(opts) {
    scan.opts = opts; scan.last = ''; scan.lastAt = 0;
    $('#scanner').innerHTML = `<div class="scanner" role="dialog" aria-modal="true" aria-label="${esc(opts.title)}"><div class="panel">
      <div class="between"><h2>${esc(opts.title)}</h2><button class="iconbtn" type="button" data-action="scan-close" aria-label="Close scanner">${icon.close}</button></div>
      <div class="cam" id="cam"><video id="camVideo" playsinline muted autoplay></video><div class="frame"></div><div class="laser"></div><div class="msg" id="camMsg">Starting camera…</div></div>
      <div class="scan-status" id="scanStatus" aria-live="polite">${esc(opts.hint)}</div>
      <form class="row" style="gap:8px" onsubmit="return false"><label class="sr" for="scanManual">Type a barcode</label>
        <input class="input" id="scanManual" inputmode="numeric" autocomplete="off" placeholder="Or type the barcode number" style="flex:1;min-width:0">
        <button class="btn" type="button" data-action="scan-manual">Enter</button></form>
      ${opts.continuous ? '<button class="btn primary" type="button" data-action="scan-close">Done scanning</button>' : ''}
    </div></div>`;
    startCamera();
  }

  function camMessage(text) { const m = $('#camMsg'); if (m) { m.textContent = text; m.style.display = text ? 'flex' : 'none'; } }

  async function startCamera() {
    const video = $('#camVideo');
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      camMessage('Camera scanning needs a secure (https) page and a browser with camera access. Type the barcode below instead.');
      return;
    }
    const constraints = { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
    try {
      if ('BarcodeDetector' in window) {
        let formats = FORMATS;
        try { const sup = await window.BarcodeDetector.getSupportedFormats(); formats = FORMATS.filter((f) => sup.includes(f)); } catch (e) { /* use defaults */ }
        if (!formats.length) throw new Error('no-formats');
        const detector = new window.BarcodeDetector({ formats });
        scan.stream = await navigator.mediaDevices.getUserMedia(constraints);
        if (!scan.opts) { stopCamera(); return; }
        video.srcObject = scan.stream; await video.play();
        camMessage('');
        const tick = async () => {
          if (!scan.opts || !scan.stream) return;
          if (!scan.busy && video.readyState >= 2) {
            scan.busy = true;
            try { const codes = await detector.detect(video); if (codes.length) handleCode(codes[0].rawValue); } catch (e) { /* frame not ready */ }
            scan.busy = false;
          }
          scan.timer = setTimeout(tick, 120);
        };
        tick();
        return;
      }
      throw new Error('no-native');
    } catch (err) {
      if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) return cameraDenied();
      if (err && err.name === 'NotFoundError') return camMessage('No camera was found on this device. Type the barcode below instead.');
      if (scan.stream) { scan.stream.getTracks().forEach((t) => t.stop()); scan.stream = null; }
    }
    // Fallback: ZXing (works in Safari / iOS and Firefox)
    try {
      await loadZxing();
      if (!scan.opts) return;
      // Default hints read all common 1D and 2D formats; restricting formats + TRY_HARDER stops ZXing decoding video frames.
      scan.reader = new window.ZXing.BrowserMultiFormatReader(undefined, 150);
      await scan.reader.decodeFromConstraints(constraints, video, (result) => { if (result) handleCode(result.getText()); });
      camMessage('');
    } catch (err) {
      if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) return cameraDenied();
      if (err && err.name === 'NotFoundError') return camMessage('No camera was found on this device. Type the barcode below instead.');
      camMessage('The camera could not be started. Type the barcode below instead.');
    }
  }
  function cameraDenied() { camMessage('Camera access was blocked. Allow camera access for this site in your browser settings, or type the barcode below.'); }

  let zxingPromise = null;
  function loadZxing() {
    if (window.ZXing) return Promise.resolve();
    if (!zxingPromise) {
      zxingPromise = new Promise((resolve, reject) => {
        const sc = document.createElement('script');
        sc.src = 'zxing.min.js'; sc.async = true;
        sc.onload = () => resolve(); sc.onerror = () => { zxingPromise = null; reject(new Error('zxing-load')); };
        document.head.appendChild(sc);
      });
    }
    return zxingPromise;
  }

  function handleCode(raw, manual) {
    if (!scan.opts) return;
    const code = String(raw).trim();
    if (!code) return;
    const now = Date.now();
    if (!manual && code === scan.last && now - scan.lastAt < 1800) return; // same item still in view
    scan.last = code; scan.lastAt = now;
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) { /* ignore */ } }
    const cam = $('#cam'); if (cam) { cam.classList.add('hit'); setTimeout(() => cam.classList.remove('hit'), 300); }
    const res = scan.opts.onCode(code) || {};
    const st = $('#scanStatus');
    if (st) {
      st.className = 'scan-status ' + (res.ok ? 'ok' : 'bad');
      st.innerHTML = '<span>' + esc(res.msg || code) + '</span>' + (res.addCode ? '<button class="btn" style="height:36px" type="button" data-action="scan-add" data-code="' + esc(res.addCode) + '">Add as new product</button>' : '');
    }
  }

  function stopCamera() {
    clearTimeout(scan.timer); scan.timer = null;
    if (scan.reader) { try { scan.reader.reset(); } catch (e) { /* ignore */ } scan.reader = null; }
    if (scan.stream) { scan.stream.getTracks().forEach((t) => t.stop()); scan.stream = null; }
    const v = $('#camVideo'); if (v && v.srcObject) { try { v.srcObject.getTracks().forEach((t) => t.stop()); } catch (e) { /* ignore */ } v.srcObject = null; }
  }
  function closeScanner() { scan.opts = null; stopCamera(); $('#scanner').innerHTML = ''; }

  function openProductForm(id, prefillBarcode) {
    const p = id ? product(id) : null;
    const cats = categories();
    const catDefault = p ? p.cat : (cats[0] || '');
    openModal(`
      <div class="between"><h2>${p ? 'Edit product' : 'New product'}</h2><button class="iconbtn" type="button" data-action="close-modal-btn" aria-label="Close">${icon.close}</button></div>
      <form id="productForm" class="stack" style="gap:12px" data-id="${p ? p.id : ''}" novalidate>
        <label class="field">Product name<input class="input" name="name" required maxlength="60" placeholder="e.g. Peanut Butter 400g" value="${p ? esc(p.name) : ''}"></label>
        <div class="grid2">
          <label class="field">Category<input class="input" name="cat" list="catList" required maxlength="30" placeholder="e.g. Grocery" value="${esc(catDefault)}"><datalist id="catList">${cats.map((c) => `<option value="${esc(c)}"></option>`).join('')}</datalist></label>
          <label class="field">Minimum level<input class="input" name="min" type="number" min="0" value="${p ? p.min : db.settings.defaultMin}"></label>
          <label class="field">Selling price (N$)<input class="input" name="price" type="number" min="0" step="0.01" required placeholder="0.00" value="${p ? p.price : ''}"></label>
          <label class="field">Cost price (N$)<input class="input" name="cost" type="number" min="0" step="0.01" required placeholder="0.00" value="${p ? p.cost : ''}"></label>
          <div class="field"><label for="pfBarcode">Barcode (optional)</label><div class="row" style="gap:6px"><input class="input" id="pfBarcode" name="barcode" inputmode="numeric" maxlength="32" style="flex:1;min-width:0" value="${p ? esc(p.barcode || '') : esc(prefillBarcode || '')}"><button class="iconbtn" type="button" data-action="scan-field" aria-label="Scan barcode into this field" style="width:46px;height:46px;color:var(--brand)">${icon.scan}</button></div></div>
          <label class="field">Supplier (optional)<input class="input" name="supplier" maxlength="40" value="${p && p.supplier !== '—' ? esc(p.supplier) : ''}"></label>
          ${p ? '' : `<label class="field">Opening stock<input class="input" name="qty" type="number" min="0" value="0"></label>`}
        </div>
        <div class="err" id="productErr" role="alert"></div>
        <button class="btn primary" type="submit" style="height:50px">${p ? 'Save changes' : 'Add product'}</button>
        ${p ? `<button class="btn danger" type="button" data-action="delete-product" data-id="${p.id}">Delete product</button>` : ''}
      </form>`);
  }

  function saveProduct(f) {
    const d = Object.fromEntries(new FormData(f));
    const err = $('#productErr');
    const name = (d.name || '').trim(), cat = (d.cat || '').trim();
    const price = parseFloat(d.price), cost = parseFloat(d.cost);
    if (!name) { err.textContent = 'Enter a product name.'; return; }
    if (!cat) { err.textContent = 'Enter a category.'; return; }
    if (!(price > 0) || !(cost > 0)) { err.textContent = 'Enter selling and cost prices above zero.'; return; }
    if (cost > price) { err.textContent = 'Cost price is higher than the selling price.'; return; }
    const dup = db.products.find((x) => x.name.toLowerCase() === name.toLowerCase() && x.id !== f.dataset.id);
    if (dup) { err.textContent = 'A product with this name already exists.'; return; }
    const code = (d.barcode || '').trim();
    const dupCode = code && db.products.find((x) => x.barcode === code && x.id !== f.dataset.id);
    if (dupCode) { err.textContent = 'This barcode already belongs to ' + dupCode.name + '.'; return; }
    const fields = { name, cat, price, cost, min: Math.max(0, parseInt(d.min, 10) || 0), barcode: (d.barcode || '').trim(), supplier: (d.supplier || '').trim() || '—' };
    if (f.dataset.id) {
      Object.assign(product(f.dataset.id), fields);
      save(); closeModal(); render(true); toast(name + ' updated');
      return;
    }
    const p = { id: 'p' + Date.now().toString(36), ...fields, stock: { main: 0, back: 0 }, sku: skuFor(cat, db.products.length + 1) };
    db.products.push(p);
    const qty = Math.max(0, parseInt(d.qty, 10) || 0);
    if (qty) { p.stock.main = qty; addMovement({ pid: p.id, type: 'receive', delta: qty, loc: 'main', ref: 'Opening stock' }); }
    save(); closeModal(); toast(name + ' added');
    if (location.hash === '#/product/' + p.id) render(); else location.hash = '#/product/' + p.id;
  }

  function deleteProduct(id) {
    const p = product(id); if (!p) return;
    if (!window.confirm('Delete ' + p.name + ' and its movement history?')) return;
    db.products = db.products.filter((x) => x.id !== id);
    db.movements = db.movements.filter((m) => m.pid !== id);
    if (db.count) { db.count.items = db.count.items.filter((x) => x !== id); delete db.count.counts[id]; }
    save(); closeModal(); toast(p.name + ' deleted'); location.hash = '#/products';
  }

  function saveProfile(f) {
    const name = (new FormData(f).get('name') || '').trim();
    if (!name) { $('#profileErr').textContent = 'Enter your name.'; return; }
    const all = users(); all[me.email].name = name; store(USERS_KEY, all);
    me.name = name; render(true); toast('Profile saved');
  }
  function saveBusiness(f) {
    const d = Object.fromEntries(new FormData(f));
    const business = (d.business || '').trim(), locMain = (d.locMain || '').trim(), locBack = (d.locBack || '').trim();
    if (!business || !locMain || !locBack) { $('#businessErr').textContent = 'Fill in all business fields.'; return; }
    if (locMain.toLowerCase() === locBack.toLowerCase()) { $('#businessErr').textContent = 'The two locations need different names.'; return; }
    Object.assign(db.settings, { business, locMain, locBack, defaultMin: Math.max(0, parseInt(d.defaultMin, 10) || 0) });
    LOCS = { main: locMain, back: locBack };
    const all = users(); all[me.email].business = business; store(USERS_KEY, all); me.business = business;
    save(); render(true); toast('Business details saved');
  }
  async function savePassword(f) {
    const d = Object.fromEntries(new FormData(f));
    const err = $('#passwordErr');
    const all = users(); const u = all[me.email];
    if (u.hash !== await hashPassword(d.current || '', u.salt)) { err.textContent = 'Current password is incorrect.'; return; }
    if ((d.next || '').length < 8) { err.textContent = 'New password must be at least 8 characters.'; return; }
    u.salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
    u.hash = await hashPassword(d.next, u.salt);
    store(USERS_KEY, all); f.reset(); err.textContent = ''; toast('Password updated');
  }

  function exportCsv() {
    const rows = [['Date', 'Product', 'SKU', 'Type', 'Quantity', 'Location', 'Reference', 'User']];
    db.movements.forEach((m) => {
      const p = product(m.pid); if (!p) return;
      rows.push([new Date(m.at).toISOString(), p.name, p.sku, m.type, m.delta, LOCS[m.loc], m.ref, m.user]);
    });
    if (rows.length === 1) { toast('No movements to export yet'); return; }
    const csv = rows.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    const link = document.createElement('a');
    link.href = url; link.download = 'kwiq-stock-movements.csv';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Exported ' + (rows.length - 1) + ' movements');
  }

  // ---------------------------------------------------------------- start
  window.addEventListener('hashchange', () => render());
  const session = read(SESSION_KEY);
  if (!(session && session.email && startSession(session.email))) endSession();
  render();
})();
</script>
</body>
</html>
