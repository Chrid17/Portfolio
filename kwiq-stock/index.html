<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kwiq Stock — Stock recording</title>
<meta name="description" content="Kwiq Stock: record stock received and issued, run barcode stock takes and track every movement.">
<meta name="theme-color" content="#0B6E5A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B6E5A'/%3E%3Cpath d='M9 8v16M9 16l9-8M12.5 13l7 11' stroke='white' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0B6E5A;--brand-dark:#08513F;--brand-tint:#E3F1EC;--brand-on:#CFE8E0;
  --ink:#0F1A17;--muted:#56665F;--line:#E1E7E4;--line-soft:#EDF1EF;--ground:#F4F6F5;--card:#FFFFFF;
  --out:#B4400B;--out-tint:#FDEEE4;--warn:#8A4B00;--warn-tint:#FFF1DB;--bad:#B42318;--bad-tint:#FDE8E7;
  --blue:#2F54B8;--blue-tint:#E8EEFB;--purple:#6B3FA0;--purple-tint:#F1EAF9;--amber-tint:#FFF4E0;--amber:#9A5B00;
  --radius:16px;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;background:var(--ground);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #5FD3B3;outline-offset:2px}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:20px 20px 110px}
.content{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;height:calc(76px + env(safe-area-inset-bottom));padding:0 6px env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:20}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.bottomnav a.active{color:var(--brand);font-weight:800}
.bottomnav .fab{width:54px;height:54px;border-radius:18px;background:var(--brand);display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 8px 20px rgba(11,110,90,.35)}
body.signed-out .sidebar,body.signed-out .bottomnav{display:none !important}
body.signed-out .main{padding:0}
body.signed-out .content{max-width:none}
@media (min-width:900px){
  .sidebar{display:flex;flex-direction:column;gap:6px;width:240px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}
  .bottomnav{display:none}
  .main{padding:28px 36px 48px}
  .mobile-only{display:none !important}
}
@media (max-width:899px){.desktop-only{display:none !important}}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:700;font-size:15px}
.sidebar a:hover{background:var(--ground);color:var(--ink)}
.sidebar a.active{background:var(--brand-tint);color:var(--brand)}
.sidebar .cta{margin-top:10px;background:var(--brand);color:#fff;justify-content:center}
.sidebar .cta:hover{background:var(--brand-dark);color:#fff}
.sidebar .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line-soft)}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}

/* Components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
h2{margin:0;font-size:17px;font-weight:800}
.sub{font-size:13px;color:var(--muted);font-weight:600}
.btn{height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn:hover{border-color:#C9D3CE}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.danger{color:var(--bad);border-color:#F3C6C2}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink)}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--brand-tint);color:var(--brand)}
.b-low{background:var(--warn-tint);color:var(--warn)}
.b-out{background:var(--bad-tint);color:var(--bad)}
.thumb{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.list > *{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink)}
.list > *:last-child{border-bottom:none}
.list > a:hover{background:#FAFBFA}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-size:15px;font-weight:700}
.meta{font-size:12px;color:var(--muted)}
.qty{font-family:var(--mono);font-weight:600;font-size:16px}
.bar{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.bar > span{display:block;height:100%;border-radius:3px}
.seg{display:grid;gap:4px;padding:4px;background:#E4EAE7;border-radius:14px}
.seg button{height:40px;border:none;border-radius:11px;background:transparent;font-weight:700;font-size:13px;color:#46554F}
.seg button[aria-checked="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,26,23,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.input{height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;color:var(--ink);width:100%}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,110,90,.15)}
.input[readonly]{background:var(--ground);color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);flex:1;min-width:0}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid-cards{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:900px){.grid-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:0}
.err:empty{display:none}

/* Home */
.hero{background:var(--brand);color:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.6px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis a{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;color:#fff;display:flex;flex-direction:column;gap:2px}
.kpis a:hover{background:rgba(255,255,255,.2)}
.kpis b{font-size:22px}
.kpis span{font-size:12px;color:var(--brand-on)}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.actions a{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:12px;font-weight:700}
.actions a > span{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.actions a:hover > span{transform:translateY(-2px)}
@media (min-width:900px){.actions a{flex-direction:row;justify-content:flex-start;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;font-size:14px}.actions a > span{width:44px;height:44px;border-radius:12px}}
.welcome{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;width:100%}
.steps li{display:flex;gap:12px;align-items:center;font-size:14px;font-weight:600}
.steps li span{width:28px;height:28px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}

/* Record */
.stepper{display:flex;align-items:center;justify-content:center;gap:20px}
.stepper button{width:54px;height:54px;border-radius:16px;border:1px solid var(--line);background:var(--ground);display:flex;align-items:center;justify-content:center}
.stepper button.plus{background:var(--brand);border-color:var(--brand)}
.stepper input{width:120px;text-align:center;font-family:var(--mono);font-size:42px;font-weight:600;border:none;background:transparent;color:var(--ink)}
.stepper input:focus{outline:none}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.quick button{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-family:var(--mono);font-weight:600;font-size:13px}

/* Scan */
.scan{height:130px;border-radius:18px;background:var(--ink);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;border:none;width:100%;font-weight:700;font-size:14px;overflow:hidden}
.scan i{position:absolute;width:26px;height:26px;border-color:#5FD3B3;border-style:solid;border-width:0}
.scan .tl{top:18px;left:22%;border-top-width:3px;border-left-width:3px;border-radius:6px 0 0 0}
.scan .tr{top:18px;right:22%;border-top-width:3px;border-right-width:3px;border-radius:0 6px 0 0}
.scan .bl{bottom:18px;left:22%;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 6px}
.scan .br{bottom:18px;right:22%;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 6px 0}
.scan .laser{position:absolute;left:22%;right:22%;height:2px;background:#5FD3B3;box-shadow:0 0 10px #5FD3B3;top:50%;animation:laser 1.6s ease-in-out infinite;opacity:0}
.scan.on .laser{opacity:1}
@keyframes laser{0%,100%{top:28%}50%{top:72%}}
.counter{display:flex;align-items:center;gap:6px}
.counter button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--ground);font-weight:800;font-size:16px}
.counter button.plus{background:var(--brand);border-color:var(--brand);color:#fff}
.counter input{width:52px;height:34px;text-align:center;border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-weight:600;font-size:15px}
.hl{background:#F2FAF7}

/* Reports */
.chart{height:170px;display:grid;gap:8px;align-items:end}
.chart .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bars{display:flex;align-items:flex-end;gap:3px;height:140px}
.chart .bars span{width:12px;border-radius:4px;min-height:3px}
.chart .lbl{font-size:11px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr}
.auth-side{display:none}
.auth-main{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.auth-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.auth-card form{display:flex;flex-direction:column;gap:14px}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:34px;padding:0 10px;border:none;background:none;color:var(--brand);font-weight:700;font-size:13px}
.hint{font-size:12px;color:var(--muted);font-weight:500}
.switch{font-size:14px;color:var(--muted);text-align:center}
.switch a{font-weight:800}
@media (min-width:900px){
  .auth{grid-template-columns:1fr 1fr}
  .auth-side{display:flex;flex-direction:column;justify-content:space-between;background:var(--brand);color:#fff;padding:48px}
  .auth-side h2{font-size:34px;line-height:1.15;letter-spacing:-.8px;max-width:440px}
  .auth-side ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;font-size:16px;color:var(--brand-on)}
  .auth-side li{display:flex;gap:12px;align-items:center}
}

/* Settings */
.settings{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:760px;width:100%}
.settings form{display:flex;flex-direction:column;gap:12px}
.settings .card h2{font-size:16px}

/* Modal + toast */
.overlay{position:fixed;inset:0;background:rgba(15,26,23,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px;display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:22px}}
/* Camera scanner */
.scanner{position:fixed;inset:0;background:rgba(15,26,23,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scanner .panel{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:96vh;overflow:auto}
@media (min-width:640px){.scanner{align-items:center}.scanner .panel{border-radius:22px}}
.cam{position:relative;width:100%;aspect-ratio:4/3;background:#0F1A17;border-radius:16px;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border:3px solid #5FD3B3;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.cam .laser{position:absolute;left:14%;right:14%;height:2px;background:#5FD3B3;box-shadow:0 0 10px #5FD3B3;top:50%;animation:laser2 1.6s ease-in-out infinite}
@keyframes laser2{0%,100%{top:34%}50%{top:66%}}
.cam .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;font-size:14px;font-weight:600;line-height:1.5}
.cam.hit .frame{border-color:#fff;background:rgba(95,211,179,.25)}
.scan-status{min-height:44px;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;background:var(--ground);display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.scan-status.ok{background:var(--brand-tint);color:var(--brand)}
.scan-status.bad{background:var(--warn-tint);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:60;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){.toast{bottom:28px}}
body.signed-out .toast{bottom:28px}
</style>
</head>

<div class="app">
  <nav class="sidebar" aria-label="Main">

    <a href="#/products" data-nav="products"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg>Products</a>

    <a href="#/settings" data-nav="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
    <a href="#/record" data-nav="record" class="cta"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Record stock</a>
    <a href="#/settings" class="me" id="sideMe" aria-label="Account settings"></a>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <div class="content" id="view" aria-live="polite"></div>
  </main>

  <nav class="bottomnav" aria-label="Main">
    <a href="#/home" data-nav="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#/products" data-nav="products"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg>Products</a>
    <a href="#/record" data-nav="record" aria-label="Record stock"><span class="fab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="#/count" data-nav="count"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3"/><path d="m9 13 2 2 4-4"/></svg>Count</a>
    <a href="#/reports" data-nav="reports"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<div id="modal"></div>
<div id="scanner"></div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- helpers
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => 'N$ ' + Math.round(n).toLocaleString('en-ZA').replace(/,/g, ' ');
  const money2 = (n) => 'N$ ' + n.toFixed(2);
  const fmtNum = (n) => Math.round(n).toLocaleString('en-ZA').replace(/,/g, ' ');
  const DAY = 86400000;
  const TONES = [['--amber-tint', '--amber'], ['--brand-tint', '--brand'], ['--blue-tint', '--blue'], ['--purple-tint', '--purple']];
  const USERS_KEY = 'kwiq-users-v2';
  const SESSION_KEY = 'kwiq-session-v2';
  const dataKey = (email) => 'kwiq-data-v2:' + email;
  let LOCS = { main: 'Main Store', back: 'Storeroom' };

  function store(key, val) { try { if (val === undefined) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* storage unavailable */ } }
  function read(key) { try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

  function timeAgo(t) {
    const d = Date.now() - t;
    if (d < 60000) return 'just now';
    if (d < 3600000) return Math.floor(d / 60000) + ' min ago';
    const date = new Date(t), now = new Date();
    const hm = date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    if (date.toDateString() === now.toDateString()) return 'Today, ' + hm;
    if (date.toDateString() === new Date(Date.now() - DAY).toDateString()) return 'Yesterday, ' + hm;
    return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + hm;
  }
  const initials = (name) => (String(name).split(/\s+/).filter((w) => /^[A-Za-z]/.test(w)).slice(0, 2).map((w) => w[0]).join('') || String(name).slice(0, 2)).toUpperCase();
  const tone = (id) => TONES[[...id].reduce((a, c) => a + c.charCodeAt(0), 0) % TONES.length];
  const thumb = (p, size) => {
    const t = tone(p.id);
    const s = size ? `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.3)}px;` : '';
    return `<span class="thumb" style="${s}background:var(${t[0]});color:var(${t[1]})">${esc(initials(p.name))}</span>`;
  };
  const icon = {
    in: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m18 13-6 6-6-6"/></svg>',
    out: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>',
    adj: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 13 2 2 4-4"/></svg>',
    tr: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3h4v4"/><path d="M21 3 14 10"/><path d="M7 21H3v-4"/><path d="m3 21 7-7"/></svg>',
    search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
    scan: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M11 8v8M15 8v8M18 8v8"/></svg>',
    back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
    plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    minus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>',
    check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
    close: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    download: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>',
    logout: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>',
    box: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg>',
    logo: '<svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 6v20M9 16l10-9M12.5 12.5l8 13.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round" fill="none"/></svg>'
  };

  // ---------------------------------------------------------------- accounts
  async function hashPassword(password, salt) {
    const text = salt + ':' + password;
    if (window.crypto && crypto.subtle && window.TextEncoder) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
    }
    let h = 5381; for (let i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) | 0;
    return 'x' + (h >>> 0).toString(16);
  }
  const users = () => read(USERS_KEY) || {};
  const go = (h) => { if (location.hash === h) render(); else location.hash = h; };
  let me = null; // { email, name, business, ... }

  function emptyDb(business) {
    return {
      products: [], movements: [], nextGrv: 1001, nextId: 1, count: null,
      settings: { business: business || 'My Business', locMain: 'Main Store', locBack: 'Storeroom', defaultMin: 10 }
    };
  }

  // Optional demo catalogue, only loaded when the user asks for it in Settings.
  function sampleData(base) {
    const catalog = [
      ['Cooking Oil 2L', 'Grocery', 64.99, 51.2, 50, 9, 0], ['Maize Meal 10kg', 'Grocery', 119.99, 96.5, 40, 17, 0],
      ['Sugar Brown 2kg', 'Grocery', 42.5, 33.9, 40, 21, 0], ['Rice Long Grain 2kg', 'Grocery', 46.99, 36.4, 30, 64, 24],
      ['Baked Beans 410g', 'Grocery', 18.99, 13.1, 36, 46, 12], ['Long Life Milk 1L', 'Dairy', 21.99, 16.75, 48, 64, 36],
      ['Butter 500g', 'Dairy', 69.99, 55.0, 20, 31, 0], ['Fruit Juice 1L', 'Beverages', 24.99, 18.3, 40, 56, 24],
      ['Still Water 1.5L', 'Beverages', 12.99, 8.6, 60, 140, 96], ['Dishwashing Liquid 750ml', 'Household', 29.99, 21.9, 30, 0, 0],
      ['Bath Soap 175g', 'Household', 14.99, 9.8, 60, 132, 48], ['Washing Powder 2kg', 'Household', 89.99, 70.3, 18, 0, 6]
    ];
    const d = emptyDb(base.settings.business);
    d.settings = base.settings;
    d.products = catalog.map((c, i) => ({
      id: 's' + (i + 1), name: c[0], cat: c[1], price: c[2], cost: c[3], min: c[4], stock: { main: c[5], back: c[6] },
      sku: skuFor(c[1], i + 1), barcode: '600' + String(1234500000 + i * 97).slice(0, 10), supplier: '—'
    }));
    let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const now = Date.now(); const who = me ? me.name.split(' ')[0] : 'You';
    for (let day = 27; day >= 0; day--) {
      d.products.forEach((p) => {
        if (rnd() < 0.8) d.movements.push({ id: 'm' + d.nextId++, pid: p.id, type: 'issue', delta: -Math.max(1, Math.round(p.min / 7 * (0.4 + rnd() * 1.3))), loc: 'main', ref: 'Sale', user: who, at: now - day * DAY - (1 + Math.floor(rnd() * 9)) * 3600000 });
        if (rnd() < 0.09) d.movements.push({ id: 'm' + d.nextId++, pid: p.id, type: 'receive', delta: Math.round(p.min * (1 + rnd())), loc: 'main', ref: 'GRV-' + d.nextGrv++, user: who, at: now - day * DAY - (2 + Math.floor(rnd() * 6)) * 3600000 });
      });
    }
    d.movements.sort((a, b) => b.at - a.at);
    return d;
  }
  function skuFor(cat, n) {
    const pre = (cat || 'GEN').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase().padEnd(3, 'X');
    return pre + '-' + String(n).padStart(4, '0');
  }

  let db = null;
  function loadData() {
    db = read(dataKey(me.email)) || emptyDb(me.business);
    if (!db.settings) db.settings = emptyDb(me.business).settings;
    LOCS = { main: db.settings.locMain, back: db.settings.locBack };
  }
  function save() { if (me && db) store(dataKey(me.email), db); }

  function startSession(email) {
    const u = users()[email];
    if (!u) return false;
    me = { email, name: u.name, business: u.business };
    store(SESSION_KEY, { email });
    loadData();
    document.body.classList.remove('signed-out');
    return true;
  }
  function endSession() {
    if (typeof closeScanner === 'function' && document.getElementById('scanner') && document.getElementById('scanner').innerHTML) closeScanner();
    me = null; db = null;
    store(SESSION_KEY, undefined);
    document.body.classList.add('signed-out');
  }

  const product = (id) => db.products.find((p) => p.id === id);
  const onHand = (p) => p.stock.main + p.stock.back;
  const status = (p) => (onHand(p) === 0 ? 'out' : onHand(p) < p.min ? 'low' : 'ok');
  const statusBadge = (p) => {
    const st = status(p);
    return `<span class="badge b-${st}">${st === 'out' ? 'Out of stock' : st === 'low' ? 'Low stock' : 'In stock'}</span>`;
  };
  const reorderQty = (p) => Math.max(0, p.min * 2 - onHand(p));
  const categories = () => [...new Set(db.products.map((p) => p.cat))].sort();

  function addMovement(m) {
    m.id = 'm' + db.nextId++;
    m.at = Date.now();
    m.user = me.name.split(' ')[0];
    db.movements.unshift(m);
  }

  // ---------------------------------------------------------------- UI plumbing
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.innerHTML = icon.check + '<span>' + esc(msg) + '</span>';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }
  function openModal(html) {
    $('#modal').innerHTML = `<div class="overlay" data-action="close-modal"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    const first = $('#modal input, #modal select');
    if (first) first.focus();
  }
  function closeModal() { $('#modal').innerHTML = ''; }
  const pwField = (name, label, auto, hint) => `
    <label class="field">${label}
      <span class="pw"><input class="input" name="${name}" type="password" autocomplete="${auto}" required minlength="8" style="padding-right:64px">
      <button type="button" data-action="toggle-pw" aria-label="Show password">Show</button></span>
      ${hint ? `<span class="hint">${hint}</span>` : ''}
    </label>`;

  // ---------------------------------------------------------------- auth views
  function authShell(inner) {
    return `<div class="auth">
      <aside class="auth-side">
        <div class="brand" style="padding:0;color:#fff"><span class="logo" style="background:#fff">${icon.logo.replace('#fff', '#0B6E5A')}</span>Kwiq Stock</div>
        <div class="stack" style="gap:28px">
          <h2>Know exactly what's on your shelves.</h2>
          <ul>
            <li>${icon.check}Record stock received, sold and moved</li>
            <li>${icon.check}Run stock takes with barcode scanning</li>
            <li>${icon.check}See low stock before you run out</li>
          </ul>
        </div>
        <span style="font-size:13px;color:var(--brand-on)">Your account and stock data are stored in this browser.</span>
      </aside>
      <div class="auth-main"><div class="auth-card">
        <div class="brand mobile-only" style="padding:0"><span class="logo">${icon.logo}</span>Kwiq Stock</div>
        ${inner}
      </div></div>
    </div>`;
  }
  function viewLogin() {
    const hasUsers = Object.keys(users()).length > 0;
    return authShell(`
      <div class="stack" style="gap:6px"><h1>Welcome back</h1><span class="sub">Log in to manage your stock.</span></div>
      <form id="loginForm" novalidate>
        <label class="field">Email<input class="input" name="email" type="email" autocomplete="email" required placeholder="you@business.com"></label>
        ${pwField('password', 'Password', 'current-password')}
        <div class="err" id="authErr" role="alert"></div>
        <button class="btn primary" type="submit" style="height:50px">Log in</button>
      </form>
      <p class="switch">${hasUsers ? 'New to Kwiq Stock?' : 'No account yet?'} <a href="#/signup">Create an account</a></p>`);
  }
  function viewSignup() {
    return authShell(`
      <div class="stack" style="gap:6px"><h1>Create your account</h1><span class="sub">Set up your business in under a minute.</span></div>
      <form id="signupForm" novalidate>
        <label class="field">Your name<input class="input" name="name" autocomplete="name" required maxlength="50" placeholder="e.g. Maria Shikongo"></label>
        <label class="field">Business name<input class="input" name="business" autocomplete="organization" required maxlength="60" placeholder="e.g. Shikongo General Dealer"></label>
        <label class="field">Email<input class="input" name="email" type="email" autocomplete="email" required placeholder="you@business.com"></label>
        ${pwField('password', 'Password', 'new-password', 'At least 8 characters.')}
        <div class="err" id="authErr" role="alert"></div>
        <button class="btn primary" type="submit" style="height:50px">Create account</button>
      </form>
      <p class="switch">Already have an account? <a href="#/login">Log in</a></p>`);
  }

  async function doLogin(f) {
    const d = Object.fromEntries(new FormData(f));
    const email = (d.email || '').trim().toLowerCase();
    const err = $('#authErr');
    if (!email || !d.password) { err.textContent = 'Enter your email and password.'; return; }
    const u = users()[email];
    if (!u || u.hash !== await hashPassword(d.password, u.salt)) { err.textContent = 'Email or password is incorrect.'; return; }
    startSession(email);
    go('#/home');
    toast('Welcome back, ' + u.name.split(' ')[0]);
  }
  async function doSignup(f) {
    const d = Object.fromEntries(new FormData(f));
    const name = (d.name || '').trim(), business = (d.business || '').trim(), email = (d.email || '').trim().toLowerCase();
    const err = $('#authErr');
    if (!name || !business) { err.textContent = 'Enter your name and business name.'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Enter a valid email address.'; return; }
    if ((d.password || '').length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }
    const all = users();
    if (all[email]) { err.textContent = 'An account with this email already exists. Log in instead.'; return; }
    const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
    all[email] = { name, business, salt, hash: await hashPassword(d.password, salt), created: Date.now() };
    store(USERS_KEY, all);
    store(dataKey(email), emptyDb(business));
    startSession(email);
    go('#/home');
    toast('Account created. Add your first product to get started.');
  }

  // ---------------------------------------------------------------- app views
  const ui = { cat: 'All', q: '', sort: 'low', recType: 'receive', recPid: null, recQty: 1, period: 'week', countCat: 'All', filter: null };

  function viewHome() {
    const value = db.products.reduce((s, p) => s + onHand(p) * p.cost, 0);
    const low = db.products.filter((p) => status(p) === 'low');
    const out = db.products.filter((p) => status(p) === 'out');
    const weekAgo = Date.now() - 7 * DAY;
    const soldWeek = db.movements.filter((m) => m.type === 'issue' && m.at > weekAgo).reduce((s, m) => s - m.delta, 0);
    const running = db.products.filter((p) => status(p) !== 'ok').sort((a, b) => onHand(a) / Math.max(1, a.min) - onHand(b) / Math.max(1, b.min)).slice(0, 5);
    const recent = db.movements.slice(0, 6);
    const today = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    const first = me.name.split(' ')[0];
    const noProducts = db.products.length === 0;
    return `
      <div class="between">
        <div class="stack grow" style="gap:2px"><span class="sub">${today} · Hi ${esc(first)}</span><h1 class="ellipsis">${esc(db.settings.business)}</h1></div>
        <a class="avatar mobile-only" href="#/settings" aria-label="Settings and profile" style="width:44px;height:44px;border-radius:14px">${esc(initials(me.name))}</a>
      </div>
      <section class="hero" aria-label="Stock summary">
        <div class="between" style="align-items:flex-start;flex-wrap:wrap">
          <div class="stack" style="gap:4px"><span style="font-size:13px;color:var(--brand-on);font-weight:600">Stock value on hand (at cost)</span><span class="big">${money(value)}</span></div>
          <span class="badge" style="background:#fff;color:var(--brand)">${fmtNum(soldWeek)} units issued · 7 days</span>
        </div>
        <div class="kpis">
          <a href="#/products"><b>${db.products.length}</b><span>Products</span></a>
          <a href="#/products?f=low"><b>${low.length}</b><span>Low stock</span></a>
          <a href="#/products?f=out"><b>${out.length}</b><span>Out of stock</span></a>
        </div>
      </section>
      ${noProducts ? `
      <section class="card pad welcome">
        <h2>Get started</h2>
        <ol class="steps">
          <li><span>1</span>Add the products you stock, with prices and a minimum level.</li>
          <li><span>2</span>Record stock as it arrives and as it is sold or used.</li>
          <li><span>3</span>Run a stock take to check shelves against the system.</li>
        </ol>
        <button class="btn primary" type="button" data-action="add-product">${icon.plus}Add your first product</button>
      </section>` : ''}
      <section class="actions" aria-label="Quick actions">
        <a href="#/record?t=receive"><span style="background:var(--brand-tint);color:var(--brand)">${icon.in}</span>Receive</a>
        <a href="#/record?t=issue"><span style="background:var(--out-tint);color:var(--out)">${icon.out}</span>Issue</a>
        <a href="#/count"><span style="background:var(--blue-tint);color:var(--blue)">${icon.adj}</span>Stock take</a>
        <a href="#/record?t=transfer"><span style="background:var(--purple-tint);color:var(--purple)">${icon.tr}</span>Transfer</a>
      </section>
      <div class="grid-cards">
        <section class="stack">
          <div class="between"><h2>Running low</h2><a href="#/reports" style="font-weight:700;font-size:14px">Reorder list</a></div>
          <div class="card list">${running.length ? running.map(rowLow).join('') : `<div class="empty">${noProducts ? 'Products below their minimum level will appear here.' : 'Everything is above its minimum level.'}</div>`}</div>
        </section>
        <section class="stack">
          <div class="between"><h2>Recent activity</h2><a href="#/reports" style="font-weight:700;font-size:14px">Reports</a></div>
          <div class="card list">${recent.length ? recent.map((m) => rowMove(m, true)).join('') : '<div class="empty">No stock movements yet. Receive or issue stock and it will show here.</div>'}</div>
        </section>
      </div>`;
  }

  function rowLow(p) {
    const pct = Math.min(100, Math.round((onHand(p) / Math.max(1, p.min)) * 100));
    const col = status(p) === 'out' ? 'var(--bad)' : pct < 25 ? 'var(--out)' : '#E8890C';
    return `<a href="#/product/${p.id}">${thumb(p)}
      <span class="grow stack" style="gap:6px"><span class="name ellipsis">${esc(p.name)}</span><span class="bar"><span style="width:${Math.max(3, pct)}%;background:${col}"></span></span></span>
      <span class="stack" style="gap:2px;align-items:flex-end"><span class="qty" style="color:${status(p) === 'out' ? 'var(--bad)' : 'var(--warn)'}">${onHand(p)}</span><span class="meta">min ${p.min}</span></span></a>`;
  }

  function rowMove(m, withName) {
    const p = product(m.pid);
    const kind = m.type === 'receive' ? ['in', 'var(--brand-tint)', 'var(--brand)', 'Received']
      : m.type === 'issue' ? ['out', 'var(--out-tint)', 'var(--out)', 'Issued']
      : m.type === 'transfer' ? ['tr', 'var(--purple-tint)', 'var(--purple)', 'Transfer']
      : ['adj', 'var(--blue-tint)', 'var(--blue)', 'Adjusted'];
    const title = withName && p ? esc(p.name) : esc(m.ref || kind[3]);
    const sub = (withName ? esc(m.ref || kind[3]) + ' · ' : '') + esc(LOCS[m.loc] || '') + ' · ' + timeAgo(m.at) + ' · ' + esc(m.user);
    const sign = m.delta > 0 ? '+' : m.delta < 0 ? '−' : '±';
    const color = m.delta > 0 ? 'var(--brand)' : m.delta < 0 ? 'var(--out)' : 'var(--muted)';
    const open = p ? `<a href="#/product/${p.id}">` : '<div>';
    const close = p ? '</a>' : '</div>';
    return `${open}<span class="thumb" style="width:38px;height:38px;border-radius:10px;background:${kind[1]};color:${kind[2]}">${icon[kind[0]]}</span>
      <span class="grow stack" style="gap:1px"><span class="name ellipsis" style="font-size:14px">${title}</span><span class="meta ellipsis">${sub}</span></span>
      <span class="qty" style="font-size:15px;color:${color}">${sign}${Math.abs(m.delta)}</span>${close}`;
  }

  function viewProducts(params) {
    if (params.f) ui.filter = params.f;
    const cats = ['All', ...categories()];
    if (!cats.includes(ui.cat)) ui.cat = 'All';
    const q = ui.q.trim().toLowerCase();
    let list = db.products.filter((p) => (ui.cat === 'All' || p.cat === ui.cat)
      && (!ui.filter || status(p) === ui.filter)
      && (!q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || (p.barcode || '').includes(q)));
    const sorts = {
      low: (a, b) => onHand(a) / Math.max(1, a.min) - onHand(b) / Math.max(1, b.min),
      name: (a, b) => a.name.localeCompare(b.name),
      value: (a, b) => onHand(b) * b.cost - onHand(a) * a.cost
    };
    list = list.sort(sorts[ui.sort]);
    const filterLabel = ui.filter === 'low' ? 'Low stock' : ui.filter === 'out' ? 'Out of stock' : '';
    if (!db.products.length) {
      return `<div class="between"><h1>Products</h1></div>
        <div class="card empty" style="padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:14px">
          <span class="thumb" style="width:60px;height:60px;border-radius:18px;background:var(--brand-tint);color:var(--brand)">${icon.box}</span>
          <b style="font-size:17px;color:var(--ink)">No products yet</b>
          <span>Add the items you sell or store. You can set prices, a minimum level and opening stock.</span>
          <button class="btn primary" type="button" data-action="add-product">${icon.plus}Add product</button>
        </div>`;
    }
    return `
      <div class="between"><h1>Products</h1><button class="btn primary" type="button" data-action="add-product">${icon.plus}New product</button></div>
      <div class="row" style="gap:10px">
        <label class="search">${icon.search}<span class="sr">Search products</span><input id="q" type="search" placeholder="Search name, SKU or barcode" value="${esc(ui.q)}" autocomplete="off"></label>
        <button class="iconbtn" style="width:48px;height:48px;color:var(--brand)" type="button" data-action="scan-search" aria-label="Scan barcode">${icon.scan}</button>
      </div>
      <div class="chips" role="group" aria-label="Category">${cats.map((c) => `<button type="button" class="chip" aria-pressed="${c === ui.cat}" data-action="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <div class="between sub">
        <span>${list.length} product${list.length === 1 ? '' : 's'}${filterLabel ? ` · <button type="button" data-action="clear-filter" style="border:none;background:var(--warn-tint);color:var(--warn);font-weight:700;border-radius:999px;padding:3px 10px;font-size:12px">${filterLabel} ✕</button>` : ''}</span>
        <label class="row" style="gap:6px">Sort
          <select class="input" id="sort" style="height:36px;width:auto;font-size:13px;font-weight:700">
            <option value="low"${ui.sort === 'low' ? ' selected' : ''}>Lowest stock</option>
            <option value="name"${ui.sort === 'name' ? ' selected' : ''}>Name</option>
            <option value="value"${ui.sort === 'value' ? ' selected' : ''}>Stock value</option>
          </select></label>
      </div>
      <div class="card list" id="plist">${list.length ? list.map((p) => `
        <a href="#/product/${p.id}">${thumb(p)}
          <span class="grow stack" style="gap:3px"><span class="name ellipsis">${esc(p.name)}</span><span class="meta mono">${esc(p.sku)} · ${money2(p.price)}</span></span>
          <span class="desktop-only meta" style="width:110px">${esc(p.cat)}</span>
          <span class="stack" style="gap:4px;align-items:flex-end"><span class="qty">${onHand(p)}</span>${statusBadge(p)}</span>
        </a>`).join('') : '<div class="empty">No products match your search.</div>'}</div>`;
  }

  function viewProduct(id) {
    const p = product(id);
    if (!p) return `<div class="card empty">This product no longer exists. <a href="#/products">Back to products</a></div>`;
    const moves = db.movements.filter((m) => m.pid === p.id).slice(0, 12);
    const st = status(p);
    const color = st === 'out' ? 'var(--bad)' : st === 'low' ? 'var(--warn)' : 'var(--ink)';
    return `
      <div class="between">
        <a class="iconbtn" href="#/products" aria-label="Back to products">${icon.back}</a>
        <span style="font-weight:800">Product</span>
        <button class="iconbtn" type="button" data-action="edit-product" data-id="${p.id}" aria-label="Edit product"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      </div>
      <div class="grid-cards">
        <section class="card pad stack" style="gap:14px">
          <div class="row" style="gap:14px">${thumb(p, 60)}

              <span class="meta mono">${esc(p.sku)}${p.barcode ? ' · ' + esc(p.barcode) : ''}</span><span>${statusBadge(p)}</span></div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
            <div style="background:var(--ground);border-radius:12px;padding:10px"><div class="sub">On hand</div><div class="qty" style="font-size:24px;color:${color}">${onHand(p)}</div></div>
            <div style="background:var(--ground);border-radius:12px;padding:10px"><div class="sub">Minimum</div><div class="qty" style="font-size:24px">${p.min}</div></div>
            <div style="background:var(--ground);border-radius:12px;padding:10px"><div class="sub">Reorder</div><div class="qty" style="font-size:24px;color:var(--brand)">${status(p) !== 'ok' && reorderQty(p) ? '+' + reorderQty(p) : '—'}</div></div>
          </div>
          <div class="grid2" style="font-size:14px">
            <div class="stack" style="gap:2px"><span class="meta">Selling price</span><b>${money2(p.price)}</b></div>
            <div class="stack" style="gap:2px"><span class="meta">Cost price</span><b>${money2(p.cost)}</b></div>
            <div class="stack" style="gap:2px"><span class="meta">Category</span><b>${esc(p.cat)}</b></div>
            <div class="stack" style="gap:2px"><span class="meta">Supplier</span><b>${esc(p.supplier || '—')}</b></div>
          </div>
          <div class="stack" style="gap:8px"><h2 style="font-size:15px">Stock by location</h2>
            <div class="card list">
              <div><span class="grow name" style="font-size:14px">${esc(LOCS.main)}</span><span class="qty">${p.stock.main}</span></div>
              <div><span class="grow name" style="font-size:14px">${esc(LOCS.back)}</span><span class="qty">${p.stock.back}</span></div>
            </div>
          </div>
          <div class="grid2">
            <a class="btn" href="#/record?t=issue&p=${p.id}">${icon.out}Issue</a>
            <a class="btn primary" href="#/record?t=receive&p=${p.id}">${icon.in}Receive</a>
          </div>
        </section>
        <section class="stack">
          <h2>Movement history</h2>
          <div class="card list">${moves.length ? moves.map((m) => rowMove(m, false)).join('') : '<div class="empty">No movements yet for this product.</div>'}</div>
        </section>
      </div>`;
  }

  function needProducts(title) {
    return `<div class="between"><h1>${title}</h1></div>
      <div class="card empty" style="padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:14px">
        <span class="thumb" style="width:60px;height:60px;border-radius:18px;background:var(--brand-tint);color:var(--brand)">${icon.box}</span>
        <b style="font-size:17px;color:var(--ink)">Add a product first</b>
        <span>You need at least one product before you can ${title === 'Stock take' ? 'count stock' : 'record stock movements'}.</span>
        <button class="btn primary" type="button" data-action="add-product">${icon.plus}Add product</button>
      </div>`;
  }

  function viewRecord(params) {
    if (!db.products.length) return needProducts('Record stock');
    if (params.t) ui.recType = params.t;
    if (params.p) ui.recPid = params.p;
    if (!ui.recPid || !product(ui.recPid)) ui.recPid = db.products[0].id;
    const p = product(ui.recPid);
    const types = [['receive', 'Receive'], ['issue', 'Issue'], ['adjust', 'Adjust'], ['transfer', 'Transfer']];
    const t = ui.recType;
    const refLabel = { receive: 'GRV / invoice no.', issue: 'Reason', adjust: 'Reason' }[t];
    const refPh = { receive: 'GRV-' + db.nextGrv, issue: 'Sale, damaged, expired…', adjust: 'Recount, correction…' }[t];
    return `
      <div class="between">
        <a class="iconbtn" href="#/home" aria-label="Close">${icon.close}</a>
        <h1 style="font-size:20px">Record stock</h1>
        <span style="width:44px"></span>
      </div>
      <form id="recForm" class="stack" style="gap:16px;max-width:620px;width:100%;margin:0 auto" novalidate>
        <div class="seg" role="radiogroup" aria-label="Movement type" style="grid-template-columns:repeat(4,minmax(0,1fr))">
          ${types.map(([id, l]) => `<button type="button" role="radio" aria-checked="${id === t}" data-action="rec-type" data-v="${id}">${l}</button>`).join('')}
        </div>
        <div class="field"><label for="recPid">Product</label>
          <div class="row" style="gap:8px">
          <select class="input" id="recPid" style="flex:1;min-width:0">${db.products.slice().sort((a, b) => a.name.localeCompare(b.name)).map((x) => `<option value="${x.id}"${x.id === p.id ? ' selected' : ''}>${esc(x.name)} — ${onHand(x)} on hand</option>`).join('')}</select>
          <button class="iconbtn" type="button" data-action="scan-record" aria-label="Scan product barcode" style="width:46px;height:46px;color:var(--brand)">${icon.scan}</button>
          </div>
        </div>
        <div class="card pad stack" style="gap:14px;align-items:center">
          <span class="sub">${t === 'adjust' ? 'Counted quantity' : 'Quantity'}</span>
          <div class="stepper">
            <button type="button" data-action="qty" data-v="-1" aria-label="Decrease quantity">${icon.minus}</button>
            <label><span class="sr">Quantity</span><input id="recQty" type="number" inputmode="numeric" min="0" value="${ui.recQty}"></label>
            <button type="button" class="plus" data-action="qty" data-v="1" aria-label="Increase quantity" style="color:#fff">${icon.plus}</button>
          </div>
          <div class="quick">${[1, 6, 12, 24].map((n) => `<button type="button" data-action="qty" data-v="${n}">+${n}</button>`).join('')}</div>
          <div class="between" style="width:100%;padding-top:12px;border-top:1px solid var(--line-soft);font-size:14px">
            <span class="sub" id="balLabel"></span><span class="mono" style="font-weight:600" id="balance"></span>
          </div>
          <div class="err" id="recErr" role="alert"></div>
        </div>
        <div class="grid2">
          <label class="field">${t === 'transfer' ? 'From' : 'Location'}
            <select class="input" id="recLoc"><option value="main">${esc(LOCS.main)}</option><option value="back">${esc(LOCS.back)}</option></select></label>
          ${t === 'transfer'
            ? `<label class="field">To<select class="input" id="recTo"><option value="back">${esc(LOCS.back)}</option><option value="main">${esc(LOCS.main)}</option></select></label>`
            : `<label class="field">${refLabel}<input class="input" id="recRef" type="text" maxlength="40" placeholder="${esc(refPh)}"></label>`}
        </div>
        <button class="btn primary" type="submit" style="height:52px;font-size:16px">${icon.check}Save ${types.find((x) => x[0] === t)[1].toLowerCase()}</button>
      </form>`;
  }

  function recPreview() {
    const f = $('#recForm'); if (!f) return;
    const p = product($('#recPid').value);
    const qty = Math.max(0, parseInt($('#recQty').value, 10) || 0);
    ui.recQty = qty; ui.recPid = p.id;
    const loc = $('#recLoc').value;
    const t = ui.recType;
    let label, before, after, err = '';
    if (t === 'transfer') {
      const to = $('#recTo').value;
      label = LOCS[loc] + ' → ' + LOCS[to];
      before = p.stock[loc]; after = before - qty;
      if (loc === to) err = 'Choose two different locations.';
      else if (after < 0) err = 'Only ' + before + ' available at ' + LOCS[loc] + '.';
    } else {
      label = 'New balance at ' + LOCS[loc];
      before = p.stock[loc];
      after = t === 'receive' ? before + qty : t === 'issue' ? before - qty : qty;
      if (t === 'issue' && after < 0) err = 'Only ' + before + ' available at ' + LOCS[loc] + '.';
    }
    if (qty === 0 && t !== 'adjust') err = err || 'Enter a quantity above zero.';
    $('#balLabel').textContent = label;
    $('#balance').innerHTML = before + ' → <span style="color:' + (after < 0 ? 'var(--bad)' : 'var(--brand)') + '">' + after + '</span>';
    $('#recErr').textContent = err;
    f.querySelector('[type=submit]').disabled = !!err;
  }

  function submitRecord() {
    const p = product($('#recPid').value);
    const qty = Math.max(0, parseInt($('#recQty').value, 10) || 0);
    const loc = $('#recLoc').value;
    const t = ui.recType;
    if (t === 'transfer') {
      const to = $('#recTo').value;
      if (loc === to || qty <= 0 || p.stock[loc] < qty) return;
      p.stock[loc] -= qty; p.stock[to] += qty;
      addMovement({ pid: p.id, type: 'transfer', delta: -qty, loc, ref: 'To ' + LOCS[to] });
      addMovement({ pid: p.id, type: 'transfer', delta: qty, loc: to, ref: 'From ' + LOCS[loc] });
      toast('Moved ' + qty + ' × ' + p.name + ' to ' + LOCS[to]);
    } else {
      const ref = ($('#recRef').value || '').trim();
      let delta;
      if (t === 'receive') { if (qty <= 0) return; delta = qty; }
      else if (t === 'issue') { if (qty <= 0 || p.stock[loc] < qty) return; delta = -qty; }
      else { delta = qty - p.stock[loc]; }
      p.stock[loc] += delta;
      const refText = ref || (t === 'receive' ? 'GRV-' + db.nextGrv : t === 'issue' ? 'Issued' : 'Stock adjustment');
      if (t === 'receive' && !ref) db.nextGrv++;
      addMovement({ pid: p.id, type: t, delta, loc, ref: refText });
      toast(t === 'receive' ? 'Received ' + qty + ' × ' + p.name : t === 'issue' ? 'Issued ' + qty + ' × ' + p.name : p.name + ' set to ' + qty + ' (' + (delta >= 0 ? '+' : '−') + Math.abs(delta) + ')');
    }
    ui.recQty = 1;
    save();
    location.hash = '#/product/' + p.id;
  }

  function viewCount() {
    if (!db.products.length) return needProducts('Stock take');
    const c = db.count;
    if (!c) {
      const cats = ['All', ...categories()];
      if (!cats.includes(ui.countCat)) ui.countCat = 'All';
      const last = db.movements.find((m) => m.type === 'adjust' && m.ref === 'Stock take');
      return `
        <div class="stack" style="gap:4px"><span class="sub">Stock take · ${esc(LOCS.main)}</span><h1>Start a stock take</h1></div>
        <div class="card pad stack" style="gap:14px;max-width:620px">
          <p style="margin:0;font-size:15px;line-height:1.55;color:var(--muted)">Count what is physically on the shelves. Kwiq Stock compares your counts with the system and posts any differences as adjustments when you finish.</p>
          <div class="stack" style="gap:8px"><span class="sub">What do you want to count?</span>
            <div class="chips" role="group" aria-label="Count scope">${cats.map((x) => `<button type="button" class="chip" aria-pressed="${x === ui.countCat}" data-action="count-cat" data-v="${esc(x)}">${esc(x === 'All' ? 'Everything' : x)}</button>`).join('')}</div>
          </div>
          <span class="meta">${db.products.filter((p) => ui.countCat === 'All' || p.cat === ui.countCat).length} products · ${esc(LOCS.main)}</span>
          <button class="btn primary" type="button" data-action="count-start" style="height:52px">Start counting</button>
          <span class="meta">${last ? 'Last stock take posted ' + timeAgo(last.at) : 'No stock takes yet.'}</span>
        </div>`;
    }
    const items = c.items.map((id) => product(id)).filter(Boolean);
    const done = items.filter((p) => c.counts[p.id] != null);
    const varianceItems = done.filter((p) => c.counts[p.id] !== p.stock.main);
    const pct = items.length ? Math.round((done.length / items.length) * 100) : 0;
    return `
      <div class="between">
        <div class="stack" style="gap:4px"><span class="sub">Stock take · ${esc(c.scope === 'All' ? 'All products' : c.scope)}</span><h1>Counting</h1></div>
        <button class="btn" type="button" data-action="count-cancel">Discard</button>
      </div>
      <div class="grid-cards">
        <div class="stack" style="gap:14px">
          <div class="card pad stack" style="gap:10px">
            <div class="between" style="font-size:14px"><b>${done.length} of ${items.length} counted</b><span class="sub">${pct}%</span></div>
            <div class="bar" style="height:8px"><span style="width:${pct}%;background:var(--brand)"></span></div>
            <div class="legend"><span><i style="background:var(--brand)"></i>${done.length - varianceItems.length} match</span><span><i style="background:var(--out)"></i>${varianceItems.length} with variance</span></div>
          </div>
          <button class="scan" type="button" data-action="scan-count" id="scanBtn"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>${icon.scan}<span>Scan barcodes with your camera</span><span style="font-size:12px;font-weight:600;color:#9FB8AF">Each scan adds 1 to that product's count</span></button>
          <button class="btn primary" type="button" data-action="count-finish" ${done.length ? '' : 'disabled'} style="height:52px">Finish &amp; post ${varianceItems.length} adjustment${varianceItems.length === 1 ? '' : 's'}</button>
        </div>
        <div class="stack">
          <div class="between"><h2>Items</h2><span class="sub">System → Counted</span></div>
          <div class="card list" id="countList">${items.map((p) => countRow(p, c)).join('')}</div>
        </div>
      </div>`;
  }

  function countRow(p, c) {
    const v = c.counts[p.id];
    const has = v != null;
    const diff = has ? v - p.stock.main : 0;
    const varTxt = !has ? '—' : diff === 0 ? 'OK' : (diff > 0 ? '+' : '−') + Math.abs(diff);
    const varCol = !has ? 'var(--muted)' : diff === 0 ? 'var(--brand)' : 'var(--out)';
    return `<div data-row="${p.id}" class="${c.last === p.id ? 'hl' : ''}">
      <span class="grow stack" style="gap:2px"><span class="name ellipsis" style="font-size:14px">${esc(p.name)}</span><span class="meta mono">${esc(p.sku)} · system ${p.stock.main}</span></span>
      <span class="counter">
        <button type="button" data-action="cnt" data-id="${p.id}" data-v="-1" aria-label="Remove one ${esc(p.name)}">−</button>
        <label><span class="sr">Counted ${esc(p.name)}</span><input type="number" min="0" inputmode="numeric" data-cnt="${p.id}" value="${has ? v : ''}" placeholder="–"></label>
        <button type="button" class="plus" data-action="cnt" data-id="${p.id}" data-v="1" aria-label="Add one ${esc(p.name)}">+</button>
      </span>
      <span class="mono" style="width:40px;text-align:right;font-weight:600;font-size:13px;color:${varCol}">${varTxt}</span>
    </div>`;
  }

  function viewReports() {
    const now = new Date();
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    let buckets;
    if (ui.period === 'week') {
      buckets = Array.from({ length: 7 }, (_, i) => {
        const s = startToday - (6 - i) * DAY;
        return { s, e: s + DAY, label: new Date(s).toLocaleDateString('en-GB', { weekday: 'short' }) };
      });
    } else {
      buckets = Array.from({ length: 5 }, (_, i) => {
        const e = startToday + DAY - (4 - i) * 7 * DAY;
        return { s: e - 7 * DAY, e, label: new Date(e - DAY).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) };
      });
    }
    const from = buckets[0].s;
    const inPeriod = db.movements.filter((m) => m.at >= from && m.type !== 'transfer');
    let inU = 0, inV = 0, outU = 0, outV = 0;
    const sales = {};
    inPeriod.forEach((m) => {
      const p = product(m.pid); if (!p) return;
      if (m.type === 'receive') { inU += m.delta; inV += m.delta * p.cost; }
      if (m.type === 'issue') { outU -= m.delta; outV -= m.delta * p.price; sales[p.id] = (sales[p.id] || 0) - m.delta; }
    });
    buckets.forEach((b) => {
      b.in = 0; b.out = 0;
      inPeriod.forEach((m) => {
        if (m.at < b.s || m.at >= b.e) return;
        if (m.type === 'receive') b.in += m.delta;
        if (m.type === 'issue') b.out -= m.delta;
      });
    });
    const max = Math.max(1, ...buckets.map((b) => Math.max(b.in, b.out)));
    const h = (v) => Math.round((v / max) * 136);
    const top = Object.entries(sales).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const topMax = top.length ? top[0][1] : 1;
    const reorder = db.products.filter((p) => status(p) !== 'ok').sort((a, b) => onHand(a) - onHand(b));
    const reorderCost = reorder.reduce((s, p) => s + reorderQty(p) * p.cost, 0);
    return `
      <div class="between"><h1>Reports</h1><button class="btn" type="button" data-action="export" ${db.movements.length ? '' : 'disabled'}>${icon.download}Export CSV</button></div>
      <div class="seg" role="radiogroup" aria-label="Period" style="grid-template-columns:repeat(2,minmax(0,1fr));max-width:360px">
        <button type="button" role="radio" aria-checked="${ui.period === 'week'}" data-action="period" data-v="week">Last 7 days</button>
        <button type="button" role="radio" aria-checked="${ui.period === 'month'}" data-action="period" data-v="month">Last 5 weeks</button>
      </div>
      <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        <div class="card pad stack" style="gap:4px"><span class="sub">Stock in</span><span class="qty" style="font-size:24px;color:var(--brand)">${fmtNum(inU)}</span><span class="meta">units · ${money(inV)} at cost</span></div>
        <div class="card pad stack" style="gap:4px"><span class="sub">Stock out</span><span class="qty" style="font-size:24px;color:var(--out)">${fmtNum(outU)}</span><span class="meta">units · ${money(outV)} at selling price</span></div>
      </div>
      <div class="grid-cards">
        <section class="card pad stack" style="gap:14px">
          <div class="between"><h2 style="font-size:15px">Movement</h2><div class="legend"><span><i style="background:var(--brand)"></i>In</span><span><i style="background:#F0A36B"></i>Out</span></div></div>
          <div class="chart" style="grid-template-columns:repeat(${buckets.length},minmax(0,1fr))">
            ${buckets.map((b) => `<div class="col"><div class="bars"><span title="In: ${b.in}" style="height:${h(b.in)}px;background:var(--brand)"></span><span title="Out: ${b.out}" style="height:${h(b.out)}px;background:#F0A36B"></span></div><span class="lbl">${b.label}</span></div>`).join('')}
          </div>
          <span class="sr">${buckets.map((b) => b.label + ': in ' + b.in + ', out ' + b.out).join('; ')}</span>
        </section>
        <section class="card pad stack" style="gap:12px">
          <h2 style="font-size:15px">Top issued products</h2>
          ${top.length ? top.map(([id, n]) => { const p = product(id); return `<a href="#/product/${id}" class="stack" style="gap:6px;color:var(--ink)"><span class="between" style="font-size:14px"><b class="ellipsis">${esc(p.name)}</b><span class="mono" style="font-weight:600">${n}</span></span><span class="bar"><span style="width:${Math.round((n / topMax) * 100)}%;background:var(--brand)"></span></span></a>`; }).join('') : '<div class="empty">No stock issued in this period.</div>'}
        </section>
      </div>
      <section class="stack">
        <div class="between"><h2>Reorder now</h2><span class="badge ${reorder.length ? 'b-out' : 'b-ok'}">${reorder.length} item${reorder.length === 1 ? '' : 's'}${reorder.length ? ' · ' + money(reorderCost) : ''}</span></div>
        <div class="card list">${reorder.length ? reorder.map((p) => `<a href="#/product/${p.id}">${thumb(p)}<span class="grow stack" style="gap:2px"><span class="name ellipsis" style="font-size:14px">${esc(p.name)}</span><span class="meta">${onHand(p)} on hand · min ${p.min}${p.supplier && p.supplier !== '—' ? ' · ' + esc(p.supplier) : ''}</span></span><span class="stack" style="gap:2px;align-items:flex-end"><span class="qty" style="color:var(--brand)">+${reorderQty(p)}</span><span class="meta">${money(reorderQty(p) * p.cost)}</span></span></a>`).join('') : `<div class="empty">${db.products.length ? 'Nothing to reorder. All products are above their minimum level.' : 'Products that need reordering will appear here.'}</div>`}</div>
      </section>`;
  }

  // ---------------------------------------------------------------- router
  function parse() {
    const h = location.hash.replace(/^#\/?/, '') || 'home';
    const [path, qs] = h.split('?');
    const parts = path.split('/');
    const params = {};
    (qs || '').split('&').filter(Boolean).forEach((kv) => { const [k, v] = kv.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    return { route: parts[0], id: parts[1], params };
  }

  function render(keepScroll) {
    let { route, id, params } = parse();
    if (!me) {
      if (route !== 'signup') route = 'login';
      $('#view').innerHTML = route === 'signup' ? viewSignup() : viewLogin();
      document.title = 'Kwiq Stock — ' + (route === 'signup' ? 'Create account' : 'Log in');
      if (!keepScroll) window.scrollTo(0, 0);
      return;
    }
    if (route === 'login' || route === 'signup') { location.replace('#/home'); return; }
    if (route !== 'products') ui.filter = null;
    let html;
    switch (route) {
      case 'products': html = viewProducts(params); break;
      case 'product': html = viewProduct(id); break;
      case 'record': html = viewRecord(params); break;
      case 'count': html = viewCount(); break;
      case 'reports': html = viewReports(); break;
      case 'settings': html = viewSettings(); break;
      default: route = 'home'; html = viewHome();
    }
    $('#view').innerHTML = html;
    $('#sideMe').innerHTML = `<span class="avatar">${esc(initials(me.name))}</span><span class="stack grow" style="gap:0"><b class="ellipsis" style="font-size:14px;color:var(--ink)">${esc(me.name)}</b><span class="meta ellipsis">${esc(db.settings.business)}</span></span>`;
    const navKey = route === 'product' ? 'products' : route;
    document.querySelectorAll('[data-nav]').forEach((a) => {
      const on = a.dataset.nav === navKey;
      a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.title = 'Kwiq Stock — ' + ({ products: 'Products', product: 'Product', record: 'Record stock', count: 'Stock take', reports: 'Reports', settings: 'Settings' }[route] || 'Home');
    if (route === 'record' && db.products.length) recPreview();
    if (!keepScroll) window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- events
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action, v = el.dataset.v;
    if (a === 'close-modal') { if (e.target === el) closeModal(); return; }
    if (a === 'close-modal-btn') { closeModal(); return; }
    if (a === 'toggle-pw') {
      const inp = el.parentElement.querySelector('input');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      el.textContent = show ? 'Hide' : 'Show';
      el.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      return;
    }
    if (!me) return;
    if (a === 'cat') { ui.cat = v; render(true); }
    if (a === 'clear-filter') { ui.filter = null; location.hash = '#/products'; }
    if (a === 'scan-search') {
      openScanner({
        title: 'Scan a product',
        hint: 'Point your camera at the product barcode.',
        onCode: (code) => {
          const p = byBarcode(code);
          if (p) { closeScanner(); toast('Found ' + p.name); location.hash = '#/product/' + p.id; return { ok: true, msg: p.name }; }
          return { ok: false, msg: 'No product has barcode ' + code + '.', addCode: code };
        }
      });
    }
    if (a === 'rec-type') { ui.recType = v; render(true); }
    if (a === 'qty') {
      const inp = $('#recQty');
      inp.value = Math.max(0, (parseInt(inp.value, 10) || 0) + parseInt(v, 10));
      recPreview();
    }
    if (a === 'count-cat') { ui.countCat = v; render(true); }
    if (a === 'count-start') {
      const items = db.products.filter((p) => ui.countCat === 'All' || p.cat === ui.countCat).map((p) => p.id);
      db.count = { scope: ui.countCat, items, counts: {}, started: Date.now(), last: null };
      save(); render();
    }
    if (a === 'count-cancel') { db.count = null; save(); render(); toast('Stock take discarded'); }
    if (a === 'cnt') {
      const c = db.count; const cur = c.counts[el.dataset.id];
      c.counts[el.dataset.id] = Math.max(0, (cur == null ? 0 : cur) + parseInt(v, 10));
      c.last = el.dataset.id; save(); render(true);
    }
    if (a === 'scan-count') {
      openScanner({
        title: 'Stock take scanning',
        hint: 'Scan each item on the shelf. Every scan adds 1 to its count.',
        continuous: true,
        onCode: (code) => {
          const c = db.count; if (!c) return { ok: false, msg: 'No stock take in progress.' };
          const p = byBarcode(code);
          if (!p) return { ok: false, msg: 'Unknown barcode ' + code + '.', addCode: code };
          if (!c.items.includes(p.id)) return { ok: false, msg: p.name + ' is not part of this count.' };
          const cur = c.counts[p.id];
          c.counts[p.id] = (cur == null ? 0 : cur) + 1; c.last = p.id; save(); render(true);
          return { ok: true, msg: p.name + ' · counted ' + c.counts[p.id] };
        }
      });
    }
    if (a === 'scan-record') {
      openScanner({
        title: 'Scan a product',
        hint: 'Point your camera at the product barcode.',
        onCode: (code) => {
          const p = byBarcode(code);
          if (!p) return { ok: false, msg: 'No product has barcode ' + code + '.', addCode: code };
          closeScanner();
          $('#recPid').value = p.id; recPreview(); toast('Selected ' + p.name);
          return { ok: true, msg: p.name };
        }
      });
    }
    if (a === 'scan-field') {
      openScanner({
        title: 'Scan barcode',
        hint: 'Scan the barcode printed on the product.',
        onCode: (code) => { closeScanner(); const f = $('#pfBarcode'); if (f) { f.value = code; f.focus(); } toast('Barcode ' + code + ' captured'); return { ok: true, msg: code }; }
      });
    }
    if (a === 'scan-add') {
      const code = el.dataset.code; closeScanner(); openProductForm(null, code);
    }
    if (a === 'scan-close') closeScanner();
    if (a === 'scan-manual') {
      const inp = $('#scanManual'); const code = (inp.value || '').trim();
      if (code) { handleCode(code, true); inp.value = ''; }
    }
    if (a === 'count-finish') {
      const c = db.count; let posted = 0;
      Object.entries(c.counts).forEach(([id, n]) => {
        const p = product(id); if (!p || n == null) return;
        const delta = n - p.stock.main;
        if (delta !== 0) { p.stock.main = n; addMovement({ pid: id, type: 'adjust', delta, loc: 'main', ref: 'Stock take' }); posted++; }
      });
      const counted = Object.keys(c.counts).length;
      db.count = null; save();
      toast('Stock take posted: ' + counted + ' counted, ' + posted + ' adjusted');
      location.hash = '#/reports';
    }
    if (a === 'period') { ui.period = v; render(true); }
    if (a === 'export') exportCsv();
    if (a === 'add-product') openProductForm();
    if (a === 'edit-product') openProductForm(el.dataset.id);
    if (a === 'delete-product') deleteProduct(el.dataset.id);
    if (a === 'logout') { endSession(); go('#/login'); toast('You have been logged out'); }
    if (a === 'load-sample') {
      if ((db.products.length || db.movements.length) && !window.confirm('Replace your current stock data with sample products?')) return;
      db = sampleData(db); save(); ui.recPid = null; go('#/home'); toast('Sample products loaded');
    }
    if (a === 'clear-data') {
      if (!window.confirm('Delete all products and stock movements? This cannot be undone.')) return;
      const settings = db.settings; db = emptyDb(settings.business); db.settings = settings; save(); ui.recPid = null; render(true); toast('All stock data cleared');
    }
    if (a === 'delete-account') {
      if (!window.confirm('Delete your account and all its stock data from this browser?')) return;
      const all = users(); delete all[me.email]; store(USERS_KEY, all); store(dataKey(me.email), undefined);
      endSession(); go('#/signup'); toast('Account deleted');
    }
  });

  document.addEventListener('input', (e) => {
    if (!me) return;
    if (e.target.id === 'q') {
      ui.q = e.target.value;
      const pos = e.target.selectionStart;
      render(true);
      const q = $('#q'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) { /* ignore */ } }
    }

      if (val == null) delete c.counts[id]; else c.counts[id] = val;
      c.last = id; save();

  });
  document.addEventListener('change', (e) => {
    if (!me) return;

    if (['recPid', 'recLoc', 'recTo'].includes(e.target.id)) recPreview();
